[package]
name = "claude-tui"
version = "0.9.0"
edition = "2021"
description = "Terminal-Arbeitsplatz für mehrere Claude-Code-Sessions"
license = "MIT"
repository = "https://github.com/NicoMertens/claude-tui"
publish = false

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
crossterm = "0.29"
portable-pty = "0.8"
ratatui = "0.30"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"

# Rückfall für Updates, wenn curl fehlt: HTTPS über das TLS des Betriebssystems (siehe http.rs).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Auf Größe optimiert; für eine TUI ist der Geschwindigkeitsunterschied nicht spürbar.
opt-level = "z"
# Kein Abwickeln bei einem Absturz: spart Code. Das Terminal setzt der Panic-Hook in main.rs zurück.
panic = "abort"
