[package]
name = "claude-tui"
version = "0.2.0"
edition = "2021"
description = "Terminal-Arbeitsplatz für mehrere Claude-Code-Sessions"
license = "MIT"
repository = "https://github.com/NicoMertens/claude-tui"
publish = false

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
crossterm = "0.29"
portable-pty = "0.8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
