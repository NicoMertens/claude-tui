[package]
name = "claude-tui"
version = "0.3.0"
edition = "2021"
description = "Terminal-Arbeitsplatz für mehrere Claude-Code-Sessions"
license = "MIT"
repository = "https://github.com/NicoMertens/claude-tui"
publish = false

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
crossterm = "0.29"
portable-pty = "0.8"
ratatui = "0.30"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"

# Release-Archive: .zip unter Windows, .tar.gz sonst (siehe release.yml)
[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
